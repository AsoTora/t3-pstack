name: Upstream sync

# Merges chhoumann/t3-pstack into this fork daily, keeps the glab forge rules,
# and retags v<VERSION> so Codex homes pin the merged tree. Any failure opens
# or updates one issue; resolve it with agent-workflows' `scripts/t3-pstack.sh sync`.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'AsoTora/t3-pstack'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the merge commit and the v<VERSION> tag
      issues: write # open or update the failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/chhoumann/t3-pstack.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already contains upstream $(git rev-parse --short upstream/main)."
            exit 0
          fi
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check the merged tree
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun tools/generate.mjs --check
          GIT_CONFIG_GLOBAL=/dev/null bun test tests/ --timeout 30000
          # Fails when upstream rewords a sentence a glab rule anchors on.
          components=$(jq -r '.components | to_entries[] | "\(.key) \(.value.sha)"' tools/upstream.json)
          while read -r component sha; do
            bun tools/sync.mjs "$component" "$sha" --dry-run > /dev/null
          done <<< "$components"
          grep -q 'glab repo view' plugins/pstack/skills/poteto-mode/playbooks/babysit.md

      - name: Push and retag
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(cat VERSION)"
          git tag -f "$tag"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$url" HEAD:main
          git push -f "$url" "refs/tags/$tag"
          echo "Merged upstream $(git rev-parse --short upstream/main), tagged $tag."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Upstream sync failed"
          body="Run: $RUN_URL

          Merge conflicts, a failed check, or an upstream change to .github/workflows (which this token cannot push) stop the sync. Resolve locally with agent-workflows' \`scripts/t3-pstack.sh sync\`, then \`scripts/t3-pstack.sh install\`."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
